<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monitoring Ability Practice (70 items)</title>
  <style>
    body {
      margin: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #eef4f4;
      color: #233238;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
    }
    h1 {
      margin-top: 1rem;
      font-weight: 500;
      font-size: 1.6rem;
    }
    #circle {
      position: relative;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: #86a9aa;
      overflow: hidden;
    }
    .dot {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
    }
    #choices {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .choice {
      padding: 0.6rem 1rem;
      background: #a0b8b9;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    .choice:hover { opacity: 0.9; }
    #nav {
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    #nav button {
      background: none;
      border: none;
      color: #233238;
      font-size: 1rem;
      cursor: pointer;
      padding: 0.5rem 1rem;
    }
    #nav button:disabled { opacity: 0.3; cursor: default; }
  </style>
</head>
<body>

  <h1>How many objects did you see?</h1>
  <div id="circle"></div>
  <div id="choices"></div>
  <div id="nav">
    <button id="prevBtn" disabled>← Previous</button>
    <span id="progress">1 / 70</span>
    <button id="nextBtn" disabled>Next →</button>
  </div>

  <script>
    // 70 dot‐counts between 3 and 13 (randomized sequence)
    const questions = [
      7,11,4,13,9,5,3,12,6,8,
      10,3,13,11,4,9,6,7,12,5,
      8,13,3,10,11,4,7,9,6,12,
      5,8,13,3,10,11,4,9,7,6,
      12,5,8,13,3,11,4,10,9,6,
      7,12,5,8,13,3,11,10,4,9,
      6,7,12,5,8,13,3,11,10,4
    ];

    // DOM references
    const circle   = document.getElementById('circle');
    const choices  = document.getElementById('choices');
    const prevBtn  = document.getElementById('prevBtn');
    const nextBtn  = document.getElementById('nextBtn');
    const progress = document.getElementById('progress');

    let current = 0, dots = [], startTime = null;

    function loadQuestion(idx) {
      // reset
      circle.innerHTML = '';
      choices.innerHTML = '';
      prevBtn.disabled = idx === 0;
      nextBtn.disabled = true;
      progress.textContent = `${idx + 1} / ${questions.length}`;

      // create answer buttons 3–13
      for (let n = 3; n <= 13; n++) {
        const btn = document.createElement('button');
        btn.textContent = n;
        btn.className = 'choice';
        btn.onclick = () => {
          if (n === questions[idx]) {
            alert('✔️ Correct!');
          } else {
            alert(`❌ Nope. It was ${questions[idx]}.`);
          }
          nextBtn.disabled = false;
        };
        choices.appendChild(btn);
      }

      // create moving dots
      dots = [];
      const count = questions[idx];
      for (let i = 0; i < count; i++) {
        const d = document.createElement('div');
        d.className = 'dot';
        // random start position inside circle
        const angle = Math.random() * 2 * Math.PI;
        const radius = Math.random() * (140 - 10);
        d.x = 150 + radius * Math.cos(angle);
        d.y = 150 + radius * Math.sin(angle);
        // random velocity
        const speed = 40 + Math.random() * 40;
        const dir   = Math.random() * 2 * Math.PI;
        d.vx = Math.cos(dir) * speed;
        d.vy = Math.sin(dir) * speed;
        circle.appendChild(d);
        dots.push(d);
      }

      // animate for 4 seconds
      startTime = null;
      function animate(ts) {
        if (!startTime) startTime = ts;
        const elapsed = ts - startTime;
        const stepDelta = Math.min(elapsed, 4000) - (animate.lastTime || 0);
        const dt = stepDelta / 1000;
        dots.forEach(d => {
          d.x += d.vx * dt;
          d.y += d.vy * dt;
          // bounce off edge
          const dx = d.x - 150, dy = d.y - 150;
          if (Math.hypot(dx, dy) > 140) {
            const norm = Math.hypot(dx, dy);
            const nx = dx / norm, ny = dy / norm;
            const proj = d.vx * nx + d.vy * ny;
            d.vx -= 2 * proj * nx;
            d.vy -= 2 * proj * ny;
            d.x = 150 + nx * 140;
            d.y = 150 + ny * 140;
          }
          d.style.transform = `translate(${d.x - 9}px,${d.y - 9}px)`;
        });
        animate.lastTime = Math.min(elapsed, 4000);
        if (elapsed < 4000) {
          requestAnimationFrame(animate);
        }
      }
      requestAnimationFrame(animate);
    }

    // navigation handlers
    prevBtn.onclick = () => {
      if (current > 0) {
        current--;
        loadQuestion(current);
      }
    };
    nextBtn.onclick = () => {
      if (current < questions.length - 1) {
        current++;
        loadQuestion(current);
      }
    };

    // initial load
    loadQuestion(0);
  </script>

</body>
</html>
